# Roda os testes do FinFlow em todo push e em todo pull request.
# São 3 jobs independentes (rodam ao mesmo tempo); o PR só fica verde se os três passarem.
# Nada aqui precisa de banco: a API Python testa com SQLite em memória e os testes Java são de unidade.
name: Testes

on:
  push:
  pull_request:

jobs:
  api-python:
    name: API Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # a mesma do Dockerfile da API
          cache: pip
          cache-dependency-path: api-python/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  api-java:
    name: API Java (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # a mesma do Dockerfile da API
          cache: maven
      - run: mvn -B test

  frontend:
    name: Frontend (sintaxe e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Sem etapa de build: o front é JS puro, então basta conferir que todo arquivo é válido
      - name: Sintaxe de todos os arquivos JS
        run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
      # Os testes do front (frontend/testes) chegam pelo PR #5; até lá este passo só avisa
      - name: Testes do front
        run: |
          if compgen -G "frontend/testes/*.test.mjs" > /dev/null; then
            node --test "frontend/testes/*.test.mjs"
          else
            echo "Ainda não há testes em frontend/testes."
          fi
