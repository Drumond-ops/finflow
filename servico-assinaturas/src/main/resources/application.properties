# ---------- Servidor ----------
server.port=8081

# ---------- Banco (o mesmo PostgreSQL da API em Python) ----------
# Os valores vêm das variáveis de ambiente (docker-compose / .env); depois do ":" fica o valor padrão.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:financeiro_db}
spring.datasource.username=${POSTGRES_USER:admin_financas}
spring.datasource.password=${POSTGRES_PASSWORD:finflow_dev}

# As tabelas são criadas pela API em Python (models.py). O Java só usa, nunca cria nem altera.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JSON em snake_case (data_inicio, id_cartao...), igual à API em Python
spring.jackson.property-naming-strategy=SNAKE_CASE

# ---------- Login ----------
# Tem que ser a MESMA chave da API em Python: assim o token do login vale nas duas APIs.
finflow.secret-key=${SECRET_KEY:chave-de-desenvolvimento-troque-em-producao}

# ---------- CORS: endereços do frontend, separados por vírgula ----------
finflow.cors-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
